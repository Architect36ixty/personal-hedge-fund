name: Hourly Crypto Agents

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-crypto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crypto Scout
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          PYTHONPATH: .
        run: python agents/crypto/scout.py

      - name: Run Crypto Analyst
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: .
        run: python agents/crypto/analyst.py

      - name: Run Crypto Risk & Trader
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LUNO_API_KEY_ID: ${{ secrets.LUNO_API_KEY_ID }}
          LUNO_API_KEY_SECRET: ${{ secrets.LUNO_API_KEY_SECRET }}
          PYTHONPATH: .
        run: python agents/crypto/trader.py
